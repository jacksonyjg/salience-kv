# configs/gemma-2-2b.yaml
# ========================
# Gemma-2-2B 교차 아키텍처 검증용 (실험 1-C)

model: gemma-2-2b

# 현재: HuggingFace Hub 자동 다운로드
model_source: hub
model_id: google/gemma-2-2b-it

# LOCAL: 로컬 경로로 전환 시 아래 두 줄로 교체
# model_source: local
# model_id: /workspace/models/gemma-2-2b-it

max_input_length: 7500      # Gemma-2 max_length 제한 반영
dtype: bfloat16             # Gemma-2 권장 dtype

# 교차 검증은 FullKV + AdaKV + Ours만 비교
methods:
  - fullkv
  - adakv
  - ours
