# configs/default.yaml
# =====================
# 모든 실험의 기본 하이퍼파라미터
# 각 모델별 yaml에서 필요한 항목만 덮어씀

# ── 실험 공통 ──────────────────────────────
seed: 42
budget_ratio: 0.20          # KV 캐시 예산 비율 (20%)
num_samples: null           # null = 전체 샘플 / 숫자 입력 시 제한 (예: 20)
use_flash_attn: false       # FlashAttention2 사용 여부 (GPU 호환 시 true)

# ── 태스크 ─────────────────────────────────
tasks:
  - narrativeqa
  - qasper
  - multifieldqa_en
  - hotpotqa
  - 2wikimqa
  - gov_report
  - qmsum

# ── 비교 방법 ──────────────────────────────
methods:
  - fullkv
  - streaming
  - h2o
  - snapkv
  - pyramidkv
  - adakv
  - ours

# ── KV 방법 하이퍼파라미터 ─────────────────
kv_params:
  streaming:
    sink_size: 4
  h2o:
    recent_ratio: 0.1
  snapkv:
    window_size: 32
    kernel_size: 5
  pyramidkv:
    min_ratio: 0.1
  adakv:
    smoothing: 0.1
  ours:
    alpha: 0.40         # 누적 어텐션
    beta:  0.20         # 엔트로피 분산
    gamma: 0.20         # 의미적 유사성
    delta: 0.20         # 위치 감쇠
    lambda_pos: 1.0     # 위치 감쇠율
    allocation_strategy: entropy   # entropy | uniform | pyramid | random

# ── 경로 설정 ──────────────────────────────
# HuggingFace Hub에서 자동 다운로드 (현재 사용)
# LOCAL 전환 시 아래 주석 해제 후 경로 수정
paths:
  results_dir: /workspace/kv_cache_exp/results
  log_dir:     /workspace/kv_cache_exp/logs

  # LOCAL: 모델 로컬 경로
  # model_base_dir: /workspace/models

  # LOCAL: 데이터셋 로컬 경로
  # dataset_base_dir: /workspace/datasets/longbench
