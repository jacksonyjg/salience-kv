# configs/qwen3-4b.yaml
# ======================
# Qwen3-4B 주 실험 설정 (default.yaml 기준, 필요한 항목만 덮어씀)

model: qwen3-4b

# ── 모델 소스 ──────────────────────────────
# 현재: HuggingFace Hub 자동 다운로드
model_source: hub
model_id: Qwen/Qwen3-4B

# LOCAL: 로컬 경로로 전환 시 아래 두 줄로 교체
# model_source: local
# model_id: /workspace/models/Qwen3-4B

# ── Qwen3 전용 설정 ────────────────────────
enable_thinking: false      # ★ 반드시 false — true면 <think> 토큰이 점수 왜곡
max_input_length: 31000     # 8GB 제한 내 안전 최대 길이

# ── 실험별 예산 오버라이드 ─────────────────
budget_ratio: 0.20          # 주 실험 기본값

# ── 예산 민감도 분석용 (실험 4) ────────────
budget_sensitivity:
  budgets: [0.10, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50]

# ── 하이퍼파라미터 민감도 분석용 (실험 5) ──
hyperparam_sensitivity:
  lambda_values: [0.5, 1.0, 2.0]
  weight_configs:
    - label: "Default"
      alpha: 0.40  beta: 0.20  gamma: 0.20  delta: 0.20
    - label: "Uniform"
      alpha: 0.25  beta: 0.25  gamma: 0.25  delta: 0.25
    - label: "Attn-Heavy"
      alpha: 0.55  beta: 0.15  gamma: 0.15  delta: 0.15
